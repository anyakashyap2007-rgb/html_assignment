<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student_form</title>
</head>
<body>
     <h1>Student Form</h1>
       
    <form>
        <label for="username">Name:</label>
        <input type="text" name="username" id="username">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required>
        <br><br>

        <label for="gender">Gender:</label>

        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>

        <input type="radio" name="gender" id="other" value="other">
        <label for="other">Other:</label>
        <br><br>

        <label for="country">Country</label>
        <select name="country" id="country">
        <option value="select">Select your country</option>
        <option value="India">India</option>
        <option value="USA">USA</option>
        <option value="Canada">Canada</option>
        </select>
        <br><br>

        <label for="hobbies">Hobbies:</label>
        <input type="checkbox" name="reading" id="reading" value="reading">
        <label for="reading">Reading</label>
        <input type="checkbox" name="traveling" id="traveling" value="traveling">
        <label for="traveling">Traveling</label>
        <input type="checkbox" name="painting" id="painting" value="painting">
        <label for="painting">Painting</label>
        <br><br>

        <label for="number">Number:</label>
        <input type="number" name="number" id="number" minlength="10">
        <br><br>

        <label for="date">Date of Birth:</label>
        <input type="date" name="date" id="date">
        <br><br>

        <label for="week">Week:</label>
        <input type="week" name="week" id="week">
        <br><br>

        <label for="month">Month:</label>
        <input type="month" name="month" id="month">
        <br><br>

        <label for="time">Time::</label>
        <input type="time" name="time" id="time">
        <br><br>

        <label for="url">Website URL:</label>
        <input type="url" name="url" id="url">
        <br><br>

        <label for="range">Skill range:</label>
        <input type="range" name="skill range" id="range">
        <br><br>

        <label for="file">Resume:</label>
        <input type="file" name="file" id="file">
        <br><br>

        <input type="submit" value="Submit">
        <br><br>
        <input type="reset" value="Reset">


    

    </form>
</body>
</html>
