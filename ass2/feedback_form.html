<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback form</title>
</head>
<body>
    <form>
        <h1>Feedback Form</h1>

        <label for="username">Name:</label>
        <input type="text" id="username" name="username" placeholder="Write your name">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Write your email">
        <br><br>

        <label for="message">Message:</label><br>
        <textarea name="message" id="message" rows="6" cols="50"></textarea>
        <br><br>

        <label for="rate">Rate us out of 5:</label><br>
        <input type="radio" name="rate" id="rate" value="1">1 <br>
        <input type="radio" name="rate" id="rate" value="2">2 <br>
        <input type="radio" name="rate" id="rate" value="3">3 <br>
        <input type="radio" name="rate" id="rate" value="4">4 <br>
        <input type="radio" name="rate" id="rate" value="5">5 <br>

        <br><br>

        <button type="submit">Send your message!</button>
    </form>
</body>
</html>
